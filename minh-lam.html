<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mình làm | Van Anh Dao</title>
  <meta name="description" content="Các dự án Vân Anh đã và đang làm: marketing, cộng đồng và những hành trình đi làm.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vananh2002.vercel.app/minh-lam">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Vân Anh">
  <meta property="og:title" content="Mình làm | Van Anh Dao">
  <meta property="og:description" content="Các dự án Vân Anh đã và đang làm: marketing, cộng đồng và những hành trình đi làm.">
  <meta property="og:url" content="https://vananh2002.vercel.app/minh-lam">

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="components.js"></script>
</head>
<body>
  <site-header></site-header>

  <main class="grid-page narrow">
    <h1>Projects</h1>
    <div id="projects"></div>
  </main>

  <site-footer></site-footer>

  <script src="posts.js"></script>
  <script src="projects.js"></script>
  <script src="site.js"></script>
  <script>
    // Mỗi dự án là một nhóm bài trên Substack có tiêu đề chứa từ khóa, xếp từ bài cũ đến bài mới
    loadPosts().then((posts) => {
      const el = document.getElementById('projects');
      el.innerHTML = window.PROJECTS.map((project) => {
        const keyword = project.keyword.toLowerCase();
        const items = latestPosts(posts).reverse().filter((p) => p.title.toLowerCase().includes(keyword));
        return `
          <section class="grid-section">
            <h2>${escapeHtml(project.title)}</h2>
            <div class="card-grid">
              ${items.map(gridCardHtml).join('') || '<p class="empty">Các bài viết sẽ sớm được cập nhật, bạn quay lại sau nha!</p>'}
            </div>
          </section>`;
      }).join('');
      observeReveal(el);
    });
  </script>
</body>
</html>
