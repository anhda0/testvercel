<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-course | Van Anh Dao</title>
  <meta name="description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vananh2002.vercel.app/mini-course">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Vân Anh">
  <meta property="og:title" content="Mini-course | Van Anh Dao">
  <meta property="og:description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta property="og:url" content="https://vananh2002.vercel.app/mini-course">

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="components.js"></script>
</head>
<body>
  <site-header></site-header>

  <main class="grid-page narrow">
    <h1>Mini-courses</h1>
    <div class="card-grid" id="courses"></div>
  </main>

  <site-subscribe></site-subscribe>

  <site-footer></site-footer>

  <script src="posts.js"></script>
  <script src="courses.js"></script>
  <script src="site.js"></script>
  <script>
    loadPosts().then((posts) => {
      const el = document.getElementById('courses');
      el.innerHTML = window.COURSES.map((c) => {
        const lessons = courseLessons(c, posts);
        return gridCardHtml({
          url: `/mini-course/${c.slug}`,
          image: (lessons[0] || {}).image,
          title: c.title,
          excerpt: c.description,
          meta: `${lessons.length} bài học`,
        });
      }).join('');
      observeReveal(el);
    });
  </script>
</body>
</html>
