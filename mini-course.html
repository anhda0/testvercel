<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-course | Van Anh Dao</title>
  <meta name="description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vananh2002.vercel.app/mini-course">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Vân Anh">
  <meta property="og:title" content="Mini-course | Van Anh Dao">
  <meta property="og:description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta property="og:url" content="https://vananh2002.vercel.app/mini-course">

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .courses { max-width: 1097px; padding-top: 60px; padding-bottom: 120px; }
    .courses h1 { font-size: 36px; font-weight: 600; margin: 0 0 50px; }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 80px 45px;
    }
    .course .thumb { aspect-ratio: 313 / 204; }
    .course .thumb img { transition: transform 0.4s; }
    a.course:hover .thumb img { transform: scale(1.04); }
    .course h2 { font-size: 26px; font-weight: 500; line-height: 1.15; margin: 26px 0 22px; transition: color 0.2s; }
    a.course:hover h2 { color: var(--link); }
    .course p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 8px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .course .meta { color: var(--link); font-size: 14px; font-weight: 600; }

    @media (max-width: 860px) {
      .courses { padding-top: 36px; padding-bottom: 100px; }
      .courses h1 { font-size: 30px; margin-bottom: 32px; }
      .course-grid { grid-template-columns: repeat(2, 1fr); gap: 48px 24px; }
      .course h2 { font-size: 22px; margin: 18px 0 12px; }
    }
    @media (max-width: 560px) {
      .course-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Icon dùng chung -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-facebook" viewBox="0 0 24 24"><path fill="currentColor" d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3L10 15z"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M16.6 3h-3.3v12.2a2.8 2.8 0 1 1-2-2.7V9.1a6.2 6.2 0 1 0 5.3 6.1V9a7.8 7.8 0 0 0 4.4 1.4V7.1A4.4 4.4 0 0 1 16.6 3z"/></symbol>
  </svg>

  <header class="site-header">
    <div class="container wide">
      <a class="logo" href="/"><img src="images/logo.jpg" alt="" width="44" height="44">Van Anh Dao</a>
      <button class="icon-btn menu-btn" aria-label="Mở menu" aria-expanded="false" aria-controls="nav">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="nav" id="nav">
        <a href="/">Trang chủ</a>
        <a href="/mini-course">Mini-course</a>
        <a href="/hoc-cung-minh">Học cùng mình</a>
        <a href="/minh-lam">Mình làm</a>
        <a href="/gioi-thieu">Mình là ai?</a>
        <button class="icon-btn" aria-label="Tìm kiếm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="courses narrow">
    <h1>Mini-courses</h1>
    <div class="course-grid" id="courses"></div>
  </main>

  <section class="subscribe">
      <div class="container wide">
        <div>
          <h2>Để không bỏ lỡ thông tin mới nhất từ mình!</h2>
          <p>Khi nào có bài viết hoặc video mới (siêu hay), mình sẽ gửi đến bạn trước tiên</p>
        </div>
        <form>
          <input type="text" name="name" placeholder="Tên của bạn" aria-label="Tên của bạn" required>
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
          <button type="submit">Đăng ký</button>
        </form>
      </div>
  </section>

  <footer class="site-footer">
    <a class="logo" href="/"><img src="images/logo.jpg" alt="" width="44" height="44">Van Anh Dao</a>
    <div class="socials">
      <a href="#" aria-label="Facebook"><svg width="22" height="22"><use href="#i-facebook"/></svg></a>
      <a href="#" aria-label="YouTube"><svg width="22" height="22"><use href="#i-youtube"/></svg></a>
      <a href="#" aria-label="Instagram"><svg width="20" height="20"><use href="#i-instagram"/></svg></a>
      <a href="#" aria-label="TikTok"><svg width="20" height="20"><use href="#i-tiktok"/></svg></a>
    </div>
    <small>Copyright © 2025 Van Anh Dao</small>
  </footer>

  <script src="posts.js"></script>
  <script src="courses.js"></script>
  <script src="site.js"></script>
  <script>
    loadPosts().then((posts) => {
      const el = document.getElementById('courses');
      el.innerHTML = window.COURSES.map((c) => {
        const lessons = courseLessons(c, posts);
        const cover = lessons[0] || {};
        return `
          <a class="course reveal" href="/mini-course/${escapeHtml(c.slug)}">
            ${thumbHtml(cover, 'thumb')}
            <h2>${escapeHtml(c.title)}</h2>
            <p>${escapeHtml(c.description)}</p>
            <span class="meta">${lessons.length} bài học</span>
          </a>`;
      }).join('');
      observeReveal(el);
    });
  </script>
</body>
</html>
