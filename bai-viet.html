<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết | Van Anh Dao</title>
  <meta name="description" content="Bài viết của Vân Anh.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vanhda0.substack.com/">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .article { padding-top: 56px; padding-bottom: 120px; }
    .article-head { text-align: center; max-width: 640px; margin: 0 auto 40px; }
    .article-head h1 { font-size: 40px; font-weight: 600; line-height: 1.22; margin: 0 0 10px; }
    .article-head time { font-size: 18px; }
    .status { text-align: center; color: var(--muted); }

    /* Nội dung bài lấy từ Substack */
    .paper h2, .paper h3, .paper h4 { font-weight: 600; line-height: 1.3; margin: 0 0 20px; }
    .paper h2 { font-size: 24px; }
    .paper h3 { font-size: 21px; }
    .paper h4 { font-size: 18px; }
    .paper li > p { margin: 0 0 6px; }
    .paper img { max-width: 100%; height: auto; border-radius: 6px; }
    .paper figure, .paper .captioned-image-container { margin: 0 0 32px; }
    .paper figure a { text-decoration: none; }
    .paper figcaption { color: var(--muted); font-size: 15px; text-align: center; margin-top: 8px; }
    .paper blockquote, .paper .pullquote {
      margin: 0 0 32px;
      border-left: 4px solid var(--navy);
      background: var(--link-bg);
      padding: 14px 20px;
      border-radius: 0 6px 6px 0;
    }
    .paper blockquote p, .paper .pullquote p { margin: 0; }
    .paper hr { border: 0; border-top: 1px solid #e6eaef; margin: 0 0 32px; }
    .paper iframe { max-width: 100%; margin-bottom: 32px; }
    .source { font-size: 16px; color: var(--muted); border-top: 1px solid #e6eaef; padding-top: 24px; }

    /* Điều hướng trong khóa học */
    .course-nav {
      max-width: 816px;
      margin: 46px auto 0;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 24px 28px;
    }
    .course-nav .head { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 16px; }
    .course-nav .head a { color: var(--link); font-weight: 600; }
    .course-nav .links { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .course-nav .links a {
      border: 1px solid #dfe5ec;
      border-radius: 6px;
      padding: 12px 16px;
      transition: border-color 0.2s, color 0.2s;
    }
    .course-nav .links a:hover { border-color: var(--link); color: var(--link); }
    .course-nav .links small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
    .course-nav .links .next { grid-column: 2; text-align: right; }

    /* Chia sẻ */
    .share {
      max-width: 816px;
      margin: 46px auto 0;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 28px 24px 30px;
      text-align: center;
    }
    .share h2 { font-size: 22px; font-weight: 600; margin: 0 0 14px; }
    .share .socials { justify-content: center; gap: 14px; }
    .share .socials a { width: 38px; height: 38px; background: #333; }

    @media (max-width: 860px) {
      .article { padding-top: 36px; padding-bottom: 72px; }
      .article-head h1 { font-size: 28px; }
      .article-head time { font-size: 16px; }
      .paper h2 { font-size: 21px; }
      .paper h3 { font-size: 19px; }
      .share, .course-nav { margin-top: 28px; }
      .course-nav .links { grid-template-columns: 1fr; }
      .course-nav .links .next { grid-column: auto; }
    }
  </style>
</head>
<body>
  <!-- Icon dùng chung -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-facebook" viewBox="0 0 24 24"><path fill="currentColor" d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v9h4v-9h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><path fill="currentColor" d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3L10 15z"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4z"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="currentColor" d="M16.6 3h-3.3v12.2a2.8 2.8 0 1 1-2-2.7V9.1a6.2 6.2 0 1 0 5.3 6.1V9a7.8 7.8 0 0 0 4.4 1.4V7.1A4.4 4.4 0 0 1 16.6 3z"/></symbol>
  </svg>

  <header class="site-header">
    <div class="container wide">
      <a class="logo" href="/"><img src="/images/logo.jpg" alt="" width="44" height="44">Van Anh Dao</a>
      <button class="icon-btn menu-btn" aria-label="Mở menu" aria-expanded="false" aria-controls="nav">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="nav" id="nav">
        <a href="/">Trang chủ</a>
        <a href="/mini-course">Mini-course</a>
        <a href="/hoc-cung-minh">Học cùng mình</a>
        <a href="/minh-lam">Mình làm</a>
        <a href="/gioi-thieu">Mình là ai?</a>
        <button class="icon-btn" aria-label="Tìm kiếm">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="article narrow">
    <p class="status" id="status">Đang tải bài viết...</p>

    <div id="post" hidden>
      <header class="article-head reveal">
        <h1 id="title"></h1>
        <time id="date"></time>
      </header>

      <article class="paper reveal">
        <div id="content"></div>
        <p class="source">
          Bài gốc trên Substack: <a id="source-link" href="#"></a>
        </p>
      </article>

      <nav class="course-nav reveal" id="course-nav" hidden></nav>

      <aside class="share reveal">
        <h2>Chia sẻ bài viết</h2>
        <div class="socials">
          <a href="#" data-share="facebook" target="_blank" rel="noopener" aria-label="Chia sẻ lên Facebook">
            <svg width="20" height="20"><use href="#i-facebook"/></svg>
          </a>
          <a href="#" data-share="x" target="_blank" rel="noopener" aria-label="Chia sẻ lên X">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.2-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.5l11.2 14.5z"/></svg>
          </a>
          <a href="#" data-share="linkedin" target="_blank" rel="noopener" aria-label="Chia sẻ lên LinkedIn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M5 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM3.3 9h3.4v11H3.3V9zm5.6 0h3.3v1.5c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.2 2.3 4.2 5.4V20h-3.4v-5.2c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8V20H8.9V9z"/></svg>
          </a>
        </div>
      </aside>
    </div>
  </main>

  <section class="subscribe">
      <div class="container wide">
        <div>
          <h2>Để không bỏ lỡ thông tin mới nhất từ mình!</h2>
          <p>Khi nào có bài viết hoặc video mới (siêu hay), mình sẽ gửi đến bạn trước tiên</p>
        </div>
        <form>
          <input type="text" name="name" placeholder="Tên của bạn" aria-label="Tên của bạn" required>
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
          <button type="submit">Đăng ký</button>
        </form>
      </div>
  </section>

  <footer class="site-footer">
    <a class="logo" href="/"><img src="/images/logo.jpg" alt="" width="44" height="44">Van Anh Dao</a>
    <div class="socials">
      <a href="#" aria-label="Facebook"><svg width="22" height="22"><use href="#i-facebook"/></svg></a>
      <a href="#" aria-label="YouTube"><svg width="22" height="22"><use href="#i-youtube"/></svg></a>
      <a href="#" aria-label="Instagram"><svg width="20" height="20"><use href="#i-instagram"/></svg></a>
      <a href="#" aria-label="TikTok"><svg width="20" height="20"><use href="#i-tiktok"/></svg></a>
    </div>
    <small>Copyright © 2025 Van Anh Dao</small>
  </footer>

  <script src="/posts.js"></script>
  <script src="/courses.js"></script>
  <script src="/site.js"></script>
  <script>
    // Bỏ những phần chỉ dùng được trên Substack (form đăng ký, bình chọn, nút phóng ảnh) và mã lạ
    function cleanHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script, style, form, button, .subscription-widget-wrap, .subscription-widget-wrap-editor, .poll-embed, .image-link-expand')
        .forEach((el) => el.remove());
      doc.querySelectorAll('iframe').forEach((el) => {
        if (!/^https:\/\/(www\.youtube\.com|open\.spotify\.com)\//.test(el.src)) el.remove();
      });
      doc.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((a) => {
          if (a.name.startsWith('on') || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
        });
      });
      doc.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
      return doc.body.innerHTML;
    }

    function setMeta(selector, attr, value) {
      const el = document.querySelector(selector);
      if (el) el.setAttribute(attr, value);
    }

    async function showPost() {
      const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const status = document.getElementById('status');
      try {
        const res = await fetch(`/api/posts?slug=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error(res.status);
        const post = await res.json();

        document.title = `${post.title} | Van Anh Dao`;
        setMeta('meta[name="description"]', 'content', post.excerpt);
        setMeta('link[rel="canonical"]', 'href', post.substackUrl);

        document.getElementById('title').textContent = post.title;
        const date = document.getElementById('date');
        date.dateTime = post.date;
        date.textContent = timeAgo(post.date);
        document.getElementById('content').innerHTML = cleanHtml(post.html);
        const source = document.getElementById('source-link');
        source.href = post.substackUrl;
        source.textContent = post.title;

        const url = encodeURIComponent(location.origin + location.pathname);
        const text = encodeURIComponent(post.title);
        const shareUrls = {
          facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
          x: `https://twitter.com/intent/tweet?url=${url}&text=${text}`,
          linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
        };
        document.querySelectorAll('[data-share]').forEach((a) => { a.href = shareUrls[a.dataset.share]; });

        status.remove();
        document.getElementById('post').hidden = false;
        observeReveal();
        showCourseNav(post);
      } catch {
        status.innerHTML = 'Không tìm thấy bài viết này. <a class="more" href="/hoc-cung-minh">Xem các bài khác</a>';
      }
    }
    // Bài thuộc một khóa học: hiện bài trước / bài tiếp theo
    async function showCourseNav(post) {
      const posts = await loadPosts();
      for (const course of window.COURSES) {
        const lessons = courseLessons(course, posts);
        const i = lessons.findIndex((l) => l.slug === post.slug);
        if (i === -1) continue;
        const link = (l, cls, label) => l
          ? `<a class="${cls}" href="${escapeHtml(l.url)}"><small>${label}</small>Bài ${l.number}: ${escapeHtml(l.lessonTitle)}</a>`
          : '';
        const nav = document.getElementById('course-nav');
        nav.innerHTML = `
          <p class="head">Bài ${lessons[i].number} trong khóa <a href="/mini-course/${escapeHtml(course.slug)}">${escapeHtml(course.title)}</a></p>
          <div class="links">
            ${link(lessons[i - 1], 'prev', '← Bài trước')}
            ${link(lessons[i + 1], 'next', 'Bài tiếp theo →')}
          </div>`;
        nav.hidden = false;
        observeReveal(nav.parentElement);
        return;
      }
    }

    showPost();
  </script>
</body>
</html>
