<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết | Van Anh Dao</title>
  <meta name="description" content="Bài viết của Vân Anh.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vanhda0.substack.com/">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/components.js"></script>
  <style>
    .article { padding-top: 56px; padding-bottom: 120px; }
    .article-head { text-align: center; max-width: 640px; margin: 0 auto 40px; }
    .article-head h1 { font-size: 40px; font-weight: 600; line-height: 1.22; margin: 0 0 10px; }
    .article-head time { font-size: 18px; }
    .status { text-align: center; color: var(--muted); }

    /* Nội dung bài lấy từ Substack */
    .paper h2, .paper h3, .paper h4 { font-weight: 600; line-height: 1.3; margin: 0 0 20px; }
    .paper h2 { font-size: 24px; }
    .paper h3 { font-size: 21px; }
    .paper h4 { font-size: 18px; }
    .paper li > p { margin: 0 0 6px; }
    .paper img { max-width: 100%; height: auto; border-radius: 6px; }
    .paper figure, .paper .captioned-image-container { margin: 0 0 32px; }
    .paper figure a { text-decoration: none; }
    .paper figcaption { color: var(--muted); font-size: 15px; text-align: center; margin-top: 8px; }
    .paper blockquote, .paper .pullquote {
      margin: 0 0 32px;
      border-left: 4px solid var(--navy);
      background: var(--link-bg);
      padding: 14px 20px;
      border-radius: 0 6px 6px 0;
    }
    .paper blockquote p, .paper .pullquote p { margin: 0; }
    .paper hr { border: 0; border-top: 1px solid #e6eaef; margin: 0 0 32px; }
    .paper iframe { max-width: 100%; margin-bottom: 32px; }
    .source { font-size: 16px; color: var(--muted); border-top: 1px solid #e6eaef; padding-top: 24px; }

    /* Điều hướng trong khóa học */
    .course-nav {
      max-width: 816px;
      margin: 46px auto 0;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 24px 28px;
    }
    .course-nav .head { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 16px; }
    .course-nav .head a { color: var(--link); font-weight: 600; }
    .course-nav .links { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .course-nav .links a {
      border: 1px solid #dfe5ec;
      border-radius: 6px;
      padding: 12px 16px;
      transition: border-color 0.2s, color 0.2s;
    }
    .course-nav .links a:hover { border-color: var(--link); color: var(--link); }
    .course-nav .links small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
    .course-nav .links .next { grid-column: 2; text-align: right; }

    @media (max-width: 860px) {
      .article { padding-top: 36px; padding-bottom: 72px; }
      .article-head h1 { font-size: 28px; }
      .article-head time { font-size: 16px; }
      .paper h2 { font-size: 21px; }
      .paper h3 { font-size: 19px; }
      .course-nav { margin-top: 28px; }
      .course-nav .links { grid-template-columns: 1fr; }
      .course-nav .links .next { grid-column: auto; }
    }
  </style>
</head>
<body>
  <site-header></site-header>

  <main class="article narrow">
    <p class="status" id="status">Đang tải bài viết...</p>

    <div id="post" hidden>
      <header class="article-head reveal">
        <h1 id="title"></h1>
        <time id="date"></time>
      </header>

      <article class="paper reveal">
        <div id="content"></div>
        <p class="source">
          Bài gốc trên Substack: <a id="source-link" href="#"></a>
        </p>
      </article>

      <nav class="course-nav reveal" id="course-nav" hidden></nav>

      <share-buttons></share-buttons>
    </div>
  </main>

  <site-subscribe></site-subscribe>

  <site-footer></site-footer>

  <script src="/posts.js"></script>
  <script src="/courses.js"></script>
  <script src="/site.js"></script>
  <script>
    // Bỏ những phần chỉ dùng được trên Substack (form đăng ký, bình chọn, nút phóng ảnh) và mã lạ
    function cleanHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('script, style, form, button, .subscription-widget-wrap, .subscription-widget-wrap-editor, .poll-embed, .image-link-expand')
        .forEach((el) => el.remove());
      doc.querySelectorAll('iframe').forEach((el) => {
        if (!/^https:\/\/(www\.youtube\.com|open\.spotify\.com)\//.test(el.src)) el.remove();
      });
      doc.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((a) => {
          if (a.name.startsWith('on') || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
        });
      });
      doc.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
      return doc.body.innerHTML;
    }

    function setMeta(selector, attr, value) {
      const el = document.querySelector(selector);
      if (el) el.setAttribute(attr, value);
    }

    async function showPost() {
      const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const status = document.getElementById('status');
      try {
        const res = await fetch(`/api/posts?slug=${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error(res.status);
        const post = await res.json();

        document.title = `${post.title} | Van Anh Dao`;
        setMeta('meta[name="description"]', 'content', post.excerpt);
        setMeta('link[rel="canonical"]', 'href', post.substackUrl);

        document.getElementById('title').textContent = post.title;
        const date = document.getElementById('date');
        date.dateTime = post.date;
        date.textContent = timeAgo(post.date);
        document.getElementById('content').innerHTML = cleanHtml(post.html);
        const source = document.getElementById('source-link');
        source.href = post.substackUrl;
        source.textContent = post.title;

        document.querySelector('share-buttons').render(post.title);

        status.remove();
        document.getElementById('post').hidden = false;
        observeReveal();
        showCourseNav(post);
      } catch {
        status.innerHTML = 'Không tìm thấy bài viết này. <a class="more" href="/hoc-cung-minh">Xem các bài khác</a>';
      }
    }
    // Bài thuộc một khóa học: hiện bài trước / bài tiếp theo
    async function showCourseNav(post) {
      const posts = await loadPosts();
      for (const course of window.COURSES) {
        const lessons = courseLessons(course, posts);
        const i = lessons.findIndex((l) => l.slug === post.slug);
        if (i === -1) continue;
        const link = (l, cls, label) => l
          ? `<a class="${cls}" href="${escapeHtml(l.url)}"><small>${label}</small>Bài ${l.number}: ${escapeHtml(l.lessonTitle)}</a>`
          : '';
        const nav = document.getElementById('course-nav');
        nav.innerHTML = `
          <p class="head">Bài ${lessons[i].number} trong khóa <a href="/mini-course/${escapeHtml(course.slug)}">${escapeHtml(course.title)}</a></p>
          <div class="links">
            ${link(lessons[i - 1], 'prev', '← Bài trước')}
            ${link(lessons[i + 1], 'next', 'Bài tiếp theo →')}
          </div>`;
        nav.hidden = false;
        observeReveal(nav.parentElement);
        return;
      }
    }

    showPost();
  </script>
</body>
</html>
