<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khóa học | Van Anh Dao</title>
  <meta name="description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta name="author" content="Van Anh Dao">
  <link rel="canonical" href="https://vananh2002.vercel.app/mini-course">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="Vân Anh">
  <meta property="og:title" content="Mini-course | Van Anh Dao">
  <meta property="og:description" content="Các khóa học nhỏ do Vân Anh thiết kế: marketing, product, kỹ năng đi làm.">
  <meta property="og:url" content="https://vananh2002.vercel.app/mini-course">

  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/components.js"></script>
  <style>
    .course-page { padding-top: 56px; padding-bottom: 100px; }
    .course-head {
      display: flex;
      gap: 40px;
      align-items: center;
      margin-bottom: 56px;
    }
    .course-head .cover { flex: 0 0 340px; aspect-ratio: 313 / 204; border-radius: 8px; }
    .course-head .label { color: var(--link); font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .course-head h1 { font-size: 40px; font-weight: 600; line-height: 1.2; margin: 6px 0 14px; }
    .course-head p { font-size: 18px; line-height: 1.7; margin: 0 0 22px; }
    .start {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      padding: 12px 28px;
      border-radius: 4px;
      transition: filter 0.2s;
    }
    .start:hover { filter: brightness(1.08); }

    .lessons h2 { font-size: 28px; font-weight: 600; margin: 0 0 30px; }
    .lessons .post h3 { margin-top: 0; }
    .lessons .post p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

    @media (max-width: 860px) {
      .course-page { padding-top: 36px; padding-bottom: 64px; }
      .course-head { flex-direction: column; align-items: stretch; gap: 24px; margin-bottom: 40px; }
      .course-head .cover { flex: none; width: 100%; }
      .course-head h1 { font-size: 30px; }
      .course-head p { font-size: 16px; }
      .lessons h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <site-header></site-header>

  <main class="course-page narrow">
    <p class="status empty" id="status">Đang tải khóa học...</p>
    <div id="course" hidden>
      <section class="course-head reveal">
        <div class="cover ph" id="cover"></div>
        <div>
          <span class="label">Mini-course</span>
          <h1 id="title"></h1>
          <p id="description"></p>
          <a class="start" id="start" href="#">Bắt đầu học</a>
        </div>
      </section>

      <section class="lessons">
        <h2 id="count"></h2>
        <div id="lessons"></div>
      </section>
    </div>
  </main>

  <site-subscribe></site-subscribe>

  <site-footer></site-footer>

  <script src="/posts.js"></script>
  <script src="/courses.js"></script>
  <script src="/site.js"></script>
  <script>
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const course = window.COURSES.find((c) => c.slug === slug);
    const status = document.getElementById('status');

    if (!course) {
      status.innerHTML = 'Không tìm thấy khóa học này. <a class="more" href="/mini-course">Xem các khóa học</a>';
    } else {
      document.title = `${course.title} | Van Anh Dao`;
      document.querySelector('meta[name="description"]').setAttribute('content', course.description);
      document.querySelector('link[rel="canonical"]').setAttribute('href', `https://vananh2002.vercel.app/mini-course/${course.slug}`);

      loadPosts().then((posts) => {
        const lessons = courseLessons(course, posts);
        document.getElementById('title').textContent = course.title;
        document.getElementById('description').textContent = course.description;
        document.getElementById('count').textContent = `${lessons.length} bài học`;
        if (lessons[0]) {
          document.getElementById('start').href = lessons[0].url;
          if (lessons[0].image) document.getElementById('cover').innerHTML = `<img src="${escapeHtml(imageUrl(lessons[0].image, 800))}" alt="">`;
        } else {
          document.getElementById('start').hidden = true;
        }
        document.getElementById('lessons').innerHTML = lessons
          .map((p) => postItemHtml(p, { label: `Bài ${p.number}`, title: p.lessonTitle, showDate: false }))
          .join('') || '<p class="empty">Khóa học đang được chuẩn bị, bạn quay lại sau nha!</p>';
        status.remove();
        document.getElementById('course').hidden = false;
        observeReveal();
      });
    }
  </script>
</body>
</html>
